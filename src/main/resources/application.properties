spring.application.name=Backend-labb_2
spring.datasource.url=jdbc:h2:file:./data/support;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
# Set both values through environment variables to provision an initial administrator.
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
