<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Användare · Supportportalen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="shell">
    <header class="top">
        <a class="brand" th:href="@{/tickets}">Support<span>portalen</span></a>
        <nav>
            <a th:href="@{/admin/tickets}">Alla ärenden</a>
            <a th:href="@{/tickets}">Mina ärenden</a>
            <form th:action="@{/logout}" method="post">
                <button class="link-button" type="submit">Logga ut</button>
            </form>
        </nav>
    </header>

    <section class="page-heading">
        <div>
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>Hantera användare</h1>
            <p class="muted">Skapa konton, ändra roller och hantera åtkomst.</p>
        </div>
    </section>
    <div class="notice success" th:if="${message}" th:text="${message}"></div>

    <section class="admin-tools">
        <h2>Skapa användare</h2>
        <form th:action="@{/admin/users}" th:object="${form}" method="post">
            <label for="username">Användarnamn</label>
            <input id="username" th:field="*{username}" required minlength="3" maxlength="50">
            <p class="field-error" th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}">Ogiltigt användarnamn.</p>

            <label for="displayName">Visningsnamn</label>
            <input id="displayName" th:field="*{displayName}" required maxlength="80">
            <p class="field-error" th:if="${#fields.hasErrors('displayName')}"
               th:errors="*{displayName}">Ogiltigt visningsnamn.</p>

            <label for="password">Lösenord</label>
            <input id="password" type="password" th:field="*{password}" required minlength="8" maxlength="72">
            <p class="field-error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}">Ogiltigt lösenord.</p>

            <label for="new-user-role">Roll</label>
            <select id="new-user-role" th:field="*{role}">
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">USER</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Välj en roll.</p>
            <button class="button small" type="submit">Skapa konto</button>
        </form>
    </section>

    <section class="ticket-list">
        <article class="ticket-row" th:each="user : ${users}">
            <div class="ticket-main">
                <h2 th:text="${user.displayName}">Namn</h2>
                <p th:text="${'@' + user.username}">@användare</p>
                <p class="muted" th:text="${user.accountEnabled ? 'Aktivt konto' : 'Inaktiverat konto'}">
                    Kontostatus
                </p>
            </div>
            <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
                <label th:for="${'role-' + user.id}">Roll</label>
                <select th:id="${'role-' + user.id}" name="role">
                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"
                            th:selected="${role == user.role}">USER</option>
                </select>
                <button class="button small" type="submit">Spara roll</button>
            </form>
            <form th:action="@{/admin/users/{id}/enabled(id=${user.id})}" method="post">
                <input type="hidden" name="enabled" th:value="${!user.accountEnabled}">
                <button class="button small" type="submit"
                        th:text="${user.accountEnabled ? 'Inaktivera' : 'Aktivera'}">Ändra status</button>
            </form>
        </article>
    </section>
</main>
</body>
</html>
