<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mina ärenden · Supportportalen</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="shell"><header class="top"><a class="brand" th:href="@{/tickets}">Support<span>portalen</span></a><nav><a th:href="@{/tickets}">Mina ärenden</a><a th:if="${isAdmin}" th:href="@{/admin/tickets}">Alla ärenden</a><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Logga ut</button></form></nav></header>
<section class="page-heading"><div><p class="eyebrow">SUPPORTÖVERSIKT</p><h1 th:text="${adminView} ? 'Alla ärenden' : 'Mina ärenden'">Mina ärenden</h1><p class="muted">Håll koll på dina supportärenden och deras status.</p></div><a class="button" th:href="@{/tickets/new}">＋ Nytt ärende</a></section><div class="notice success" th:if="${message}" th:text="${message}"></div>
<section class="ticket-list" th:if="${!#lists.isEmpty(tickets)}"><a class="ticket-row" th:each="ticket : ${tickets}" th:href="@{/tickets/{id}(id=${ticket.id})}"><div class="ticket-main"><span class="ticket-id" th:text="|ÄRENDE #${ticket.id}|">ÄRENDE #1</span><h2 th:text="${ticket.title}">Kan inte logga in</h2><p th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</p><p class="muted" th:if="${adminView}" th:text="${ticket.owner.displayName}">Användare</p></div><span class="badge" th:classappend="${ticket.status.name() == 'RESOLVED'} ? ' done' : (${ticket.status.name() == 'IN_PROGRESS'} ? ' progress' : '')" th:text="${ticket.status.label}">Öppen</span></a></section>
<section class="empty" th:if="${#lists.isEmpty(tickets)}"><span class="empty-icon">✳</span><h2>Inga ärenden ännu</h2><p>När du skapar ett ärende visas det här.</p><a class="button" th:href="@{/tickets/new}">Skapa ditt första ärende</a></section></main></body></html>
