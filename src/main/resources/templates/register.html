<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Skapa konto · Supportportalen</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="auth-wrap"><a class="brand" th:href="@{/}">Support<span>portalen</span></a><section class="panel"><p class="eyebrow">BÖRJA HÄR</p><h1>Skapa konto</h1><p class="muted">Det tar bara en liten stund.</p>
<form th:action="@{/register}" th:object="${form}" method="post"><label for="displayName">Ditt namn</label><input id="displayName" th:field="*{displayName}" autocomplete="name" required><p class="field-error" th:errors="*{displayName}"></p><label for="username">Användarnamn</label><input id="username" th:field="*{username}" autocomplete="username" minlength="3" maxlength="50" required><p class="field-error" th:errors="*{username}"></p><label for="password">Lösenord</label><input id="password" th:field="*{password}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><p class="hint">Minst 8 tecken.</p><p class="field-error" th:errors="*{password}"></p><button class="button full" type="submit">Skapa konto</button></form><p class="footnote">Har du redan ett konto? <a th:href="@{/login}">Logga in</a></p></section></main></body></html>
