<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nytt ärende · Supportportalen</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="shell"><header class="top"><a class="brand" th:href="@{/tickets}">Support<span>portalen</span></a><nav><a th:href="@{/tickets}">← Tillbaka till mina ärenden</a></nav></header><section class="form-page"><p class="eyebrow">VI HJÄLPER GÄRNA</p><h1>Skapa ett ärende</h1><p class="muted">Beskriv problemet så tydligt du kan, så hjälper vi dig snabbare.</p><form class="panel" th:action="@{/tickets}" th:object="${form}" method="post"><label for="title">Rubrik</label><input id="title" th:field="*{title}" maxlength="120" placeholder="Vad behöver du hjälp med?" required><p class="field-error" th:errors="*{title}"></p><label for="description">Beskrivning</label><textarea id="description" th:field="*{description}" maxlength="5000" rows="8" placeholder="Berätta gärna vad du gjorde och vad som hände..." required></textarea><p class="field-error" th:errors="*{description}"></p><div class="form-actions"><a class="text-link" th:href="@{/tickets}">Avbryt</a><button class="button" type="submit">Skicka ärende <span aria-hidden="true">→</span></button></div></form></section></main></body></html>
