<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logga in · Supportportalen</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="auth-wrap"><a class="brand" th:href="@{/}">Support<span>portalen</span></a><section class="panel"><p class="eyebrow">VÄLKOMMEN TILLBAKA</p><h1>Logga in</h1><p class="muted">Fortsätt där du slutade.</p><div class="notice success" th:if="${param.registered}">Kontot är skapat. Du kan logga in nu.</div><div class="notice error" th:if="${param.error}">Fel användarnamn eller lösenord.</div><div class="notice" th:if="${param.logout}">Du har loggat ut.</div>
<form th:action="@{/login}" method="post"><label for="username">Användarnamn</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Lösenord</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button full" type="submit">Logga in</button></form><p class="footnote">Inget konto än? <a th:href="@{/register}">Skapa ett konto</a></p></section></main></body></html>
