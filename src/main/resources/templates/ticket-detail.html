<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${ticket.title} + ' · Supportportalen'">Ärende · Supportportalen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="shell">
    <header class="top">
        <a class="brand" th:href="@{/tickets}">Support<span>portalen</span></a>
        <nav>
            <a th:href="@{/tickets}">← Mina ärenden</a>
            <form th:action="@{/logout}" method="post">
                <button class="link-button" type="submit">Logga ut</button>
            </form>
        </nav>
    </header>
    <section class="detail-page">
        <p class="eyebrow" th:text="${'ÄRENDE #' + ticket.id}">ÄRENDE #1</p>
        <div class="detail-title">
            <h1 th:text="${ticket.title}">Kan inte logga in</h1>
            <span class="badge"
                  th:classappend="${ticket.status.name() == 'RESOLVED' or ticket.status.name() == 'CLOSED'} ? ' done' : (${ticket.status.name() == 'IN_PROGRESS' or ticket.status.name() == 'WAITING_FOR_USER'} ? ' progress' : '')"
                  th:text="${ticket.status.label}">Öppen</span>
        </div>
        <p class="muted"
           th:text="${'Skapat ' + #temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm') + ' · ' + ticket.owner.displayName}">
            Skapat datum
        </p>
        <p class="muted" th:if="${ticket.lastModified != null}"
           th:text="${'Senast ändrat ' + #temporals.format(ticket.lastModified, 'yyyy-MM-dd HH:mm')}">
            Senast ändrat
        </p>
        <article class="description" th:text="${ticket.description}">Beskrivning</article>

        <p class="muted" th:if="${ticket.assignedAgent != null}"
           th:text="${'Ansvarig agent: ' + ticket.assignedAgent.displayName}">Ansvarig agent</p>
        <p class="muted" th:if="${staff and ticket.assignedAgent == null}">Ärendet är inte tilldelat ännu.</p>
        <form th:if="${canClaim}" th:action="@{/agent/tickets/{id}/claim(id=${ticket.id})}" method="post">
            <button class="button small" type="submit"
                    th:text="${ticket.assignedAgent == null ? 'Tilldela mig ärendet' : 'Ärendet är tilldelat mig'}">
                Tilldela mig ärendet
            </button>
        </form>

        <section class="admin-tools" th:if="${staff}">
            <h2>Uppdatera status</h2>
            <form th:action="@{/admin/tickets/{id}/status(id=${ticket.id})}" method="post">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option th:each="status : ${statuses}" th:value="${status}"
                            th:text="${status.label}" th:selected="${status == ticket.status}">Öppen</option>
                </select>
                <button class="button small" type="submit">Spara status</button>
            </form>
        </section>

        <section class="comments">
            <h2>Kommentarer</h2>
            <p th:if="${#lists.isEmpty(comments)}">Inga kommentarer ännu.</p>
            <article th:each="comment : ${comments}" class="description">
                <p class="muted"
                   th:text="${comment.author.displayName + ' · ' + #temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">
                    Av användare · datum
                </p>
                <p th:text="${comment.content}">Kommentar</p>
            </article>

            <form th:if="${canComment}"
                  th:action="@{/tickets/{id}/comments(id=${ticket.id})}"
                  th:object="${commentForm}" method="post">
                <label for="content">Lägg till en kommentar</label>
                <textarea id="content" th:field="*{content}" rows="4" maxlength="2000" required></textarea>
                <p class="field-error" th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}">Kommentaren är ogiltig.</p>
                <button class="button small" type="submit">Skicka kommentar</button>
            </form>
        </section>
    </section>
</main>
</body>
</html>
