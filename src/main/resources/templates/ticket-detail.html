<!doctype html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${ticket.title} + ' · Supportportalen'">Ärende · Supportportalen</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="shell"><header class="top"><a class="brand" th:href="@{/tickets}">Support<span>portalen</span></a><nav><a th:href="@{/tickets}">← Mina ärenden</a><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Logga ut</button></form></nav></header><section class="detail-page"><p class="eyebrow" th:text="|ÄRENDE #${ticket.id}|">ÄRENDE #1</p><div class="detail-title"><h1 th:text="${ticket.title}">Kan inte logga in</h1><span class="badge" th:classappend="${ticket.status.name() == 'RESOLVED'} ? ' done' : (${ticket.status.name() == 'IN_PROGRESS'} ? ' progress' : '')" th:text="${ticket.status.label}">Öppen</span></div><p class="muted" th:text="|Skapat ${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')} · ${ticket.owner.displayName}|">Skapat datum</p><article class="description" th:text="${ticket.description}">Beskrivning</article><section class="admin-tools" th:if="${admin}"><h2>Uppdatera status</h2><form th:action="@{/admin/tickets/{id}/status(id=${ticket.id})}" method="post"><select name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == ticket.status}">Öppen</option></select><button class="button small" type="submit">Spara status</button></form></section></section></main></body></html>
